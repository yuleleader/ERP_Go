# ============================================================
# Cloudflare Tunnel 配置文件
# 作用：把本地服务器上运行的 ERP 系统安全暴露到公网
#       访问地址：https://chinamxl.cc.cd
# ============================================================
#
# 使用说明：
#   1. 先在本地服务器上执行 `cloudflared tunnel create erp-tunnel`
#      这一步会自动生成你要的「JSON 凭证文件」，位置在：
#      C:\Users\Administrator\.cloudflared\<隧道ID>.json
#   2. 执行 `cloudflared tunnel list` 记下隧道 ID（一串 uuid）
#   3. 把下面的 <TUNNEL_ID> 两处都替换成你的真实隧道 ID
#   4. 本文件可放在 C:\Users\Administrator\.cloudflared\config.yml
#      （cloudflared 默认读取位置），或放在本项目 cloudflare\ 目录，
#      运行时用 --config 指定路径即可。
#
# 注意：JSON 凭证文件含密钥，切勿外泄，也不要提交到 git。
# ============================================================

tunnel: <TUNNEL_ID>
credentials-file: C:\Users\Administrator\.cloudflared\<TUNNEL_ID>.json

ingress:
  # 你的 ERP 系统访问地址（前端开发服务器，由启动器.py 拉起，端口 5173，
  # 它已内置 /api 代理到后端 8000，所以只暴露 5173 即可完整使用）
  - hostname: chinamxl.cc.cd
    service: http://localhost:5173

  # 兜底规则：未匹配到上述主机名的请求返回 404
  - service: http_status:404
